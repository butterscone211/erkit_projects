name: update-data
# Refreshes every series in catalog.yaml and commits the updated store.
# Runs Monday-Friday at 07:15 UTC, and on demand from the Actions tab.
on:
  schedule:
    - cron: "15 7 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: Update data
        env:
          # Set this under Settings > Secrets and variables > Actions > Variables
          ERKIT_USER_AGENT: ${{ vars.ERKIT_USER_AGENT }}
        run: erkit update || echo "some series failed, see log above"
      - run: erkit status
      - name: Commit updated store
        run: |
          git config user.name "erkit-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/research.duckdb
          git diff --cached --quiet || git commit -m "data: scheduled update $(date -u +%F)"
          git push
